# Met en ligne la base (migrations) et les fonctions serveur sur Supabase.
# Lancement MANUEL uniquement (onglet Actions → « Déployer sur Supabase »),
# parce que la base est partagée avec ORION Core.
name: Déployer sur Supabase

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: Appliquer aussi les migrations de la base
        type: boolean
        default: false

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier les secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Affiche seulement des noms et des diagnostics, jamais les valeurs.
          ok=1
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF APP_URL CRON_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : ${name/PROJECT_REF/SUPABASE_PROJECT_REF}"; ok=0; fi
          done
          if [ -n "$PROJECT_REF" ] && ! [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF doit contenir seulement l'identifiant du projet (20 lettres et chiffres, sans https:// ni .supabase.co)."; ok=0
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN doit être une clé personnelle commençant par sbp_ (Account → Access Tokens), pas la clé anon ni service_role."; ok=0
          fi
          if [ -n "$APP_URL" ] && [[ "$APP_URL" != https://* && "$APP_URL" != http://localhost* ]]; then
            echo "::error::APP_URL doit être l'adresse complète du site, commençant par https://"; ok=0
          fi
          [ "$ok" = 1 ] && echo "Tous les secrets nécessaires sont présents."
          [ "$ok" = 1 ]

      - name: Relier le projet Supabase
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les migrations
        if: ${{ inputs.migrations }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Enregistrer les secrets des fonctions
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Fichier temporaire, jamais affiché dans le journal.
          umask 077
          {
            echo "APP_URL=$APP_URL"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            echo "CRON_SECRET=$CRON_SECRET"
            if [ -n "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY=$RESEND_API_KEY"; fi
            if [ -n "$MAIL_FROM" ]; then echo "MAIL_FROM=$MAIL_FROM"; fi
          } > "$RUNNER_TEMP/functions.env"
          supabase secrets set --env-file "$RUNNER_TEMP/functions.env" --project-ref "$PROJECT_REF"
          rm -f "$RUNNER_TEMP/functions.env"
          # Ancienne configuration Cloudflare R2 : retirée si elle existe.
          supabase secrets unset R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_ENDPOINT --project-ref "$PROJECT_REF" --yes < /dev/null || true

      - name: Déployer les fonctions
        run: |
          for fn in transfer-create transfer-complete transfer-download transfer-cleanup; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
