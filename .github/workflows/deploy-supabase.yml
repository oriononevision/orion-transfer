# Met en ligne la base (migrations) et les fonctions serveur sur Supabase.
# Lancement MANUEL uniquement (onglet Actions → « Déployer sur Supabase »),
# parce que la base est partagée avec ORION Core.
name: Déployer sur Supabase

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: Appliquer aussi les migrations de la base
        type: boolean
        default: false

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Relier le projet Supabase
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les migrations
        if: ${{ inputs.migrations }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Enregistrer les secrets des fonctions
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Fichier temporaire, jamais affiché dans le journal.
          umask 077
          {
            echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID"
            echo "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "R2_BUCKET=$R2_BUCKET"
            echo "APP_URL=$APP_URL"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            echo "CRON_SECRET=$CRON_SECRET"
            [ -n "$RESEND_API_KEY" ] && echo "RESEND_API_KEY=$RESEND_API_KEY"
            [ -n "$MAIL_FROM" ] && echo "MAIL_FROM=$MAIL_FROM"
          } > "$RUNNER_TEMP/functions.env"
          supabase secrets set --env-file "$RUNNER_TEMP/functions.env" --project-ref "$PROJECT_REF"
          rm -f "$RUNNER_TEMP/functions.env"

      - name: Déployer les fonctions
        run: |
          for fn in transfer-create transfer-complete transfer-download transfer-cleanup; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
