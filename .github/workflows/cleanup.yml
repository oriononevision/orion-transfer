# Toutes les heures : marque les transferts expirés et efface leurs fichiers
# du stockage. Ne fait rien tant que les secrets ne sont pas renseignés.
name: Nettoyage des transferts expirés

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la fonction de nettoyage
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets absents : nettoyage ignoré."
            exit 0
          fi
          # Affiche le code HTTP et la réponse (jamais de secret dedans).
          status=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://$PROJECT_REF.supabase.co/functions/v1/transfer-cleanup")
          echo "Code HTTP : $status"
          echo "Réponse : $(head -c 500 "$RUNNER_TEMP/out.json")"
          case "$status" in
            2??) ;;
            401) echo "::error::401 : la fonction exige une connexion. Redéployez (le déploiement la publie avec --no-verify-jwt)."; exit 1 ;;
            403) echo "::error::403 : CRON_SECRET différent entre GitHub et Supabase. Relancez « Déployer sur Supabase »."; exit 1 ;;
            404) echo "::error::404 : fonction transfer-cleanup absente. Lancez « Déployer sur Supabase »."; exit 1 ;;
            *) echo "::error::Échec du nettoyage (code $status)."; exit 1 ;;
          esac
