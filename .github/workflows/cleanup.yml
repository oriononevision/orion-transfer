# Toutes les heures : marque les transferts expirés et efface leurs fichiers
# du stockage. Ne fait rien tant que les secrets ne sont pas renseignés.
name: Nettoyage des transferts expirés

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la fonction de nettoyage
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets absents : nettoyage ignoré."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://$PROJECT_REF.supabase.co/functions/v1/transfer-cleanup"
